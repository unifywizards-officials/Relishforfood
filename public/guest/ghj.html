<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swiper Tabs</title>
    
    <!-- Swiper CSS -->
    <link rel="stylesheet" href="https://unpkg.com/swiper/swiper-bundle.min.css">
    
    <!-- Bootstrap CSS (if needed) -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/5.3.0/css/bootstrap.min.css">
    
    <!-- Font Awesome (if needed) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <style>
        .swiper-container {
            width: 100%;
            height: auto;
        }
        .swiper-slide {
            display: flex;
            justify-content: center;
        }
    </style>
</head><body>
    <!-- Swiper Container -->
    <div class="swiper-container">
        <div class="swiper-wrapper">
            <div class="swiper-slide">
                <ul class="nav nav-tabs fs-18 fw-500 justify-content-center text-center mb-4 sm-mb-0"
                    data-anime='{"el": "childs", "rotateX": [30, 0], "opacity": [0,1], "duration": 1200, "delay": 0, "staggervalue": 150, "easing": "easeOutQuad"}'>
                    <li class="nav-item">
                        <a class="nav-link active" data-bs-toggle="tab" href="#tab_first1">
                            <i class="fa fa-coffee d-block icon-large mb-10px"></i>Breakfast
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" data-bs-toggle="tab" href="#tab_first2">
                            <i class="fa fa-carrot d-block icon-large mb-10px"></i>Lunch
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" data-bs-toggle="tab" href="#tab_first3">
                            <i class="fa fa-utensils d-block icon-large mb-10px"></i>Sides
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" data-bs-toggle="tab" href="#tab_first4">
                            <i class="fa fa-pepper-hot d-block icon-large mb-10px"></i>Curries
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" data-bs-toggle="tab" href="#tab_first5">
                            <i class="fa fa-leaf d-block icon-large mb-10px"></i>Fresh Salads
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" data-bs-toggle="tab" href="#tab_first6">
                            <i class="fa fa-hamburger d-block icon-large mb-10px"></i>Burgers
                        </a>
                    </li>
                </ul>
            </div>
            <!-- Add more swiper-slide divs if needed -->
        </div>

    </div>

    <!-- Swiper JS -->
   
    
    <!-- Bootstrap JS (if needed) -->
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/swiper/swiper-bundle.min.js"></script>
    <script>
        var swiper = new Swiper('.swiper-container', {
            slidesPerView: 1,
            spaceBetween: 10,
            pagination: {
                el: '.swiper-pagination',
                clickable: true,
            },
            navigation: {
                nextEl: '.swiper-button-next',
                prevEl: '.swiper-button-prev',
            },
        });
    </script>
</body>
</html>
